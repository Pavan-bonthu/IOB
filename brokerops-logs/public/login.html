<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · BrokerOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:24px;
  }

  /* ambient candlestick strip, low opacity, drifts slowly */
  .candles{
    position:absolute;
    inset:0;
    z-index:0;
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 40px;
    opacity:.16;
    animation:drift 40s linear infinite;
  }
  .candle{
    width:6px;
    background:var(--accent);
    border-radius:2px;
    flex-shrink:0;
  }
  .candle.down{ background:var(--danger); }
  .candle-wick{
    width:1px;
    background:inherit;
    margin:0 auto;
  }
  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(-6%); }
  }

  .login-card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:36px 32px 30px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
  }
  .brand-mark{
    width:34px; height:34px;
    border-radius:8px;
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    letter-spacing:.01em;
  }
  .brand-name span{ color:var(--accent); }

  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:24px;
    margin-bottom:6px;
  }
  .sub{
    color:var(--text-muted);
    font-size:13.5px;
    margin-bottom:26px;
    line-height:1.5;
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:7px;
  }
  .field input{
    width:100%;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:11px 13px;
    font-size:14px;
    color:var(--text);
    font-family:var(--font-body);
    transition:border-color .15s ease;
  }
  .field input:focus{
    border-color:var(--accent);
    outline:none;
  }

  .error-msg{
    display:none;
    align-items:center;
    gap:7px;
    background:rgba(239,92,92,0.1);
    border:1px solid rgba(239,92,92,0.28);
    color:var(--danger);
    font-size:12.5px;
    border-radius:var(--radius);
    padding:9px 11px;
    margin-bottom:16px;
  }
  .error-msg.show{ display:flex; }

  .submit-btn{
    width:100%;
    background:var(--accent);
    color:#04231A;
    border:none;
    border-radius:var(--radius);
    padding:12px;
    font-weight:600;
    font-size:14px;
    font-family:var(--font-body);
    transition:background .15s ease, transform .1s ease;
    margin-top:4px;
  }
  .submit-btn:hover{ background:#3EE0B8; }
  .submit-btn:active{ transform:scale(.985); }
  .submit-btn:disabled{ opacity:.6; cursor:not-allowed; }

  .footer-note{
    margin-top:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-faint);
  }
  .footer-note svg{ width:12px; height:12px; opacity:.7; }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="login-wrap">
    <div class="candles" id="candles"></div>

    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 17L9 11L13 15L21 7" stroke="#22D3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 7H21V13" stroke="#22D3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-name">Broker<span>Ops</span></div>
      </div>

      <h1>Sign in</h1>
      <p class="sub">Access your case management and log tracker tools.</p>

      <div class="error-msg" id="errorMsg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Incorrect username or password. Try again.</span>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
      </form>

      <div class="footer-note">
        <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/></svg>
        Internal access only
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // build a decorative row of ambient candlesticks
    const candleWrap = document.getElementById('candles');
    for (let i = 0; i < 60; i++) {
      const h = 20 + Math.random() * 90;
      const down = Math.random() > 0.55;
      const c = document.createElement('div');
      c.className = 'candle' + (down ? ' down' : '');
      c.style.height = h + 'px';
      candleWrap.appendChild(c);
    }

    // if already signed in, skip straight to the dashboard
    if (getSession()) window.location.href = 'home.html';

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const ok = await attemptLogin(username, password);

      if (ok) {
        window.location.href = 'home.html';
        return;
      }

      errorMsg.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    });
  </script>
</body>
</html>
